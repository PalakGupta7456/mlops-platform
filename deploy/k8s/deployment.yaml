apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridops-api
  namespace: gridops
  labels: {app: gridops-api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # zero-downtime model rollouts
  selector:
    matchLabels: {app: gridops-api}
  template:
    metadata:
      labels: {app: gridops-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000}
      containers:
        - name: api
          image: ghcr.io/palakgupta7456/gridops:latest   # CD pins this to the commit SHA
          ports: [{containerPort: 8000, name: http}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gridops-api
  namespace: gridops
spec:
  selector: {app: gridops-api}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gridops-api
  namespace: gridops
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gridops-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gridops-api
  namespace: gridops
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gridops-api}
