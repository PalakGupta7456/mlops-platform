# Full local platform:  docker compose up --build
#   API        http://localhost:8000/docs
#   MLflow     http://localhost:5000      (tracking + model registry)
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000      (anonymous viewer; dashboard "GridOps model server")
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./state:/app/state:ro", "./docs/data:/app/docs/data:ro"]
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////state/mlflow.db --artifacts-destination /state/mlartifacts
    ports: ["5000:5000"]
    volumes: ["./state:/state"]

  trainer:
    build: .
    profiles: ["train"]          # docker compose run --rm trainer
    entrypoint: ["sh", "-c", "pip install -q mlflow && python -m gridops.pipeline --retrain"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: ["./state:/app/state", "./docs/data:/app/docs/data"]
    depends_on: [mlflow]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  loadgen:
    image: curlimages/curl:8.10.1
    profiles: ["load"]           # docker compose --profile load up loadgen   (traffic for the dashboards)
    entrypoint: ["sh", "-c", "while true; do curl -s api:8000/forecast >/dev/null; curl -s api:8000/model >/dev/null; sleep 0.5; done"]
    depends_on: [api]
