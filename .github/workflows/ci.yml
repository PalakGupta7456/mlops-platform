name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # also triggered by the hourly pipeline when a new champion is promoted

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/palakgupta7456/gridops
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    name: Lint, test, model quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[train,api,dev]"
      - run: ruff check .
      - run: pytest -v
      - name: Quality gate - model must beat the National Grid ESO forecast on held-out data
        run: |
          python -m gridops.pipeline --synthetic
          python - <<'PY'
          import json
          m = json.load(open("state/serving/model.json"))["metrics"]
          print(m)
          assert m["skill_vs_eso"] > 0, "model is worse than the ESO baseline"
          PY

  iac:
    name: Validate Kubernetes and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
      - name: Prometheus rules
        run: docker run --rm -v "$PWD/deploy/monitoring:/m" --entrypoint promtool prom/prometheus:v2.54.1 check rules /m/alerts.yml

  image:
    name: Build, scan, smoke test, push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bring in the production champion (or train one if none exists yet)
        run: |
          mkdir -p state/serving
          if git fetch --depth 1 origin live-data 2>/dev/null && git show FETCH_HEAD:state/serving/model.joblib > state/serving/model.joblib 2>/dev/null; then
            git show FETCH_HEAD:state/serving/model.json > state/serving/model.json
            echo "Using production champion: $(python3 -c "import json;print(json.load(open('state/serving/model.json'))['version'])")"
          else
            pip install -q -e ".[train]" && python -m gridops.pipeline --synthetic
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/model | tee model.json
          curl -fs localhost:8000/metrics | grep gridops_model_version
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  k8s-deploy-test:
    name: Deploy to an ephemeral Kubernetes cluster (kind)
    needs: [image, iac]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: gridops
      - name: Roll out the image that was just pushed
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          kind load docker-image ${{ env.IMAGE }}:${{ github.sha }} --name gridops
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl -n gridops set image deployment/gridops-api api=${{ env.IMAGE }}:${{ github.sha }}
          kubectl -n gridops patch deployment gridops-api -p '{"spec":{"template":{"spec":{"containers":[{"name":"api","imagePullPolicy":"IfNotPresent"}]}}}}'
          kubectl -n gridops rollout status deployment/gridops-api --timeout=180s
          kubectl -n gridops get pods -o wide
      - name: Call the service through the cluster
        run: |
          kubectl -n gridops port-forward svc/gridops-api 8080:80 &
          sleep 5
          curl -fs localhost:8080/health
          curl -fs localhost:8080/model
