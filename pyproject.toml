[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridops"
version = "1.0.0"
description = "MLOps platform: GB grid carbon-intensity forecasting with registry, champion/challenger, drift monitoring"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
train = ["mlflow>=2.16"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "prometheus-client>=0.20"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
